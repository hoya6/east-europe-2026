<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>多瑙河璀璨金秋漫遊 | 東歐三國</title>
  <script>
    // Suppress Tailwind CDN production warning
    tailwind = { config: { corePlugins: { preflight: true } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF1EB;
      --text: #4A3525;
      --hu: #FFB7B2;
      --sk: #C1E1C1;
      --cz: #AEC6CF;
    }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .font-display { font-family: 'Quicksand', 'Comfortaa', sans-serif; }
    .max-app { max-width: 28rem; margin-left: auto; margin-right: auto; }
    /* Falling leaves */
    .leaf {
      position: absolute;
      width: 18px; height: 18px;
      background: #E07A5F;
      border-radius: 0 80% 0 80%;
      opacity: 0.75;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 5;
    }
    .leaf:nth-child(2n) { background: #F2CC8F; border-radius: 80% 0 80% 0; }
    .leaf:nth-child(3n) { background: #C97B63; }
    .leaf:nth-child(4n) { background: #D4A373; width: 14px; height: 14px; }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    /* Timeline */
    .timeline-line { position: absolute; left: 1.15rem; top: 0; bottom: 0; width: 3px; background: linear-gradient(to bottom, var(--hu), var(--sk), var(--cz)); border-radius: 99px; }
    .card-img { position: relative; overflow: hidden; border-radius: 0.75rem; }
    .card-img img { width: 100%; height: 140px; object-fit: cover; }
    .card-img::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(74,53,37,0.55) 0%, transparent 55%);
    }
    /* Checkbox strike */
    input[type="checkbox"]:checked + span { text-decoration: line-through; opacity: 0.55; }
    /* Bottom nav safe area */
    .bottom-nav { padding-bottom: env(safe-area-inset-bottom, 0.5rem); }
    /* Hide scrollbar for day tabs */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* Modal */
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-[var(--bg)] text-[var(--text)]" x-data="app()" x-init="init()">

  <!-- Falling Leaves -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
    <template x-for="i in 14" :key="i">
      <div class="leaf" :style="`left:${Math.random()*100}%; animation-duration:${6+Math.random()*8}s; animation-delay:${Math.random()*5}s;`"></div>
    </template>
  </div>

  <div class="max-app min-h-screen relative z-10 shadow-2xl bg-[var(--bg)] pb-24">

    <!-- ========== HERO ========== -->
    <header class="relative h-56 overflow-hidden rounded-b-3xl">
      <img src="https://loremflickr.com/800/500/budapest,parliament,danube" alt="Budapest" class="absolute inset-0 w-full h-full object-cover" />
      <div class="absolute inset-0 bg-gradient-to-t from-[#4A3525]/80 via-[#4A3525]/40 to-transparent"></div>
      <div class="relative z-10 h-full flex flex-col justify-end p-5">
        <h1 class="font-display text-2xl font-bold text-white tracking-wide whitespace-nowrap drop-shadow-lg">多瑙河璀璨金秋漫遊</h1>
        <p class="text-white/90 text-sm mt-1 whitespace-nowrap drop-shadow">（匈牙利、斯洛伐克、捷克）23日（10/29 – 11/20）</p>
      </div>
    </header>

    <!-- ========== COUNTRY TABS ========== -->
    <nav class="sticky top-0 z-30 bg-[var(--bg)]/95 backdrop-blur-md border-b border-[#4A3525]/10 px-3 pt-3">
      <div class="flex gap-2 mb-2">
        <template x-for="c in countries" :key="c.id">
          <button @click="activeCountry = c.id; activeDay = days.filter(d => d.country === c.id)[0]?.id || activeDay"
                  class="flex-1 py-2 rounded-full text-sm font-medium transition-all"
                  :class="activeCountry === c.id ? 'text-white shadow-md' : 'bg-white/70 text-[var(--text)]'"
                  :style="activeCountry === c.id ? `background:${c.color}` : ''"
                  x-text="c.name"></button>
        </template>
      </div>
      <!-- Day horizontal scroll -->
      <div class="flex gap-2 overflow-x-auto no-scrollbar pb-3" x-show="currentView === 'plan'">
        <template x-for="d in filteredDays" :key="d.id">
          <button @click="activeDay = d.id"
                  class="flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition"
                  :class="activeDay === d.id ? 'text-white shadow' : 'bg-white/80'"
                  :style="activeDay === d.id ? `background:${countryColor(d.country)}` : ''"
                  x-text="d.label"></button>
        </template>
      </div>
    </nav>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="px-4 pt-4">

      <!-- ===== PLAN ===== -->
      <div x-show="currentView === 'plan'" x-cloak>
        <template x-for="day in filteredDays" :key="day.id">
          <div x-show="activeDay === day.id" class="space-y-4">
            <!-- Weather + Date header -->
            <div class="flex items-center justify-between bg-white/80 rounded-2xl px-4 py-3 shadow-sm">
              <div>
                <p class="font-display font-semibold text-lg" x-text="day.fullDate"></p>
                <p class="text-sm opacity-70" x-text="day.city"></p>
              </div>
              <button @click="fetchWeather(day)" class="flex items-center gap-1.5 bg-white rounded-full px-3 py-1.5 shadow text-sm font-medium"
                      :style="`border: 2px solid ${countryColor(day.country)}`">
                <span x-text="day.weatherIcon || '⛅'"></span>
                <span x-text="day.temp !== null ? day.temp + '°C' : '天氣'"></span>
              </button>
            </div>

            <!-- Timeline -->
            <div class="relative pl-10">
              <div class="timeline-line" :style="`background:${countryColor(day.country)}`"></div>
              <template x-for="(item, idx) in day.items" :key="idx">
                <div class="relative mb-5">
                  <div class="absolute -left-10 top-3 w-6 h-6 rounded-full flex items-center justify-center text-xs text-white shadow"
                       :style="`background:${countryColor(day.country)}`" x-text="item.emoji || '📍'"></div>
                  <div class="bg-white rounded-2xl shadow-md overflow-hidden">
                    <!-- Image if attraction or hotel -->
                    <div class="card-img" x-show="item.imgKey">
                      <img :src="`https://loremflickr.com/600/300/${item.imgKey}`" :alt="item.title" loading="lazy" />
                      <div class="absolute bottom-2 left-3 right-3 z-10 text-white font-medium text-sm drop-shadow" x-text="item.title"></div>
                    </div>
                    <div class="p-4">
                      <div class="flex items-start justify-between gap-2">
                        <div>
                          <p class="text-xs opacity-60" x-text="item.time"></p>
                          <h3 class="font-semibold text-base mt-0.5" x-text="item.title"></h3>
                        </div>
                        <span class="text-xl" x-text="item.emoji"></span>
                      </div>
                      <p class="text-sm mt-2 leading-relaxed opacity-85" x-text="item.desc"></p>
                      <div class="flex flex-wrap gap-2 mt-3">
                        <template x-if="item.map">
                          <a :href="item.map" target="_blank" rel="noopener"
                             class="inline-flex items-center gap-1 text-xs font-medium px-3 py-1.5 rounded-full text-white shadow-sm"
                             :style="`background:${countryColor(day.country)}`">
                            🗺️ 導航
                          </a>
                        </template>
                        <template x-if="item.modal">
                          <button @click="openModal(item.modal)"
                                  class="inline-flex items-center gap-1 text-xs font-medium px-3 py-1.5 rounded-full bg-[#4A3525]/10 underline decoration-2"
                                  :style="`text-decoration-color:${countryColor(day.country)}`"
                                  x-text="item.modalLabel || '詳情'"></button>
                        </template>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- ===== LISTS ===== -->
      <div x-show="currentView === 'lists'" x-cloak class="space-y-5">
        <h2 class="font-display text-xl font-bold">🧳 行李 Checklist</h2>
        <div class="bg-white rounded-2xl shadow-md p-4 space-y-4 max-h-[60vh] overflow-y-auto">
          <template x-for="(cat, cIdx) in luggage" :key="cIdx">
            <div>
              <p class="font-medium text-sm mb-2 opacity-80" x-text="cat.title"></p>
              <template x-for="(item, iIdx) in cat.items" :key="iIdx">
                <label class="flex items-center gap-3 py-1.5 cursor-pointer">
                  <input type="checkbox" class="w-4 h-4 rounded accent-[#E07A5F]" x-model="item.checked" />
                  <span class="text-sm" x-text="item.name"></span>
                </label>
              </template>
            </div>
          </template>
        </div>
        <h2 class="font-display text-xl font-bold">📝 個人備忘錄</h2>
        <textarea x-model="memo" rows="5" placeholder="寫下你的提醒、餐廳願望清單、購物清單…"
                  class="w-full bg-white rounded-2xl shadow-md p-4 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-[#FFB7B2]"></textarea>
      </div>

      <!-- ===== INFO ===== -->
      <div x-show="currentView === 'info'" x-cloak class="space-y-5">
        <h2 class="font-display text-xl font-bold">✈️ 航班資訊</h2>
        <div class="space-y-3">
          <template x-for="f in flights" :key="f.id">
            <div class="bg-white rounded-2xl shadow-md p-4">
              <div class="flex justify-between items-start">
                <div>
                  <p class="font-semibold" x-text="f.route"></p>
                  <p class="text-sm opacity-70 mt-1" x-text="f.detail"></p>
                </div>
                <span class="text-2xl">✈️</span>
              </div>
              <p class="text-xs mt-2 opacity-60" x-text="f.baggage"></p>
              <button @click="openModal(f.modal)" class="mt-2 text-xs underline" style="text-decoration-color:#FFB7B2">更多細節</button>
            </div>
          </template>
        </div>

        <h2 class="font-display text-xl font-bold mt-6">🏨 住宿清單</h2>
        <div class="space-y-3">
          <template x-for="h in hotels" :key="h.id">
            <div class="bg-white rounded-2xl shadow-md overflow-hidden">
              <div class="card-img h-28">
                <img :src="`https://loremflickr.com/600/300/${h.imgKey},exterior,building`" :alt="h.name" class="w-full h-28 object-cover" />
              </div>
              <div class="p-4">
                <p class="font-semibold" x-text="h.name"></p>
                <p class="text-sm opacity-70" x-text="h.period"></p>
                <p class="text-xs mt-1 opacity-60" x-text="h.address"></p>
                <div class="flex gap-2 mt-3">
                  <a :href="h.map" target="_blank" class="text-xs px-3 py-1.5 rounded-full text-white" :style="`background:${h.color}`">🗺️ 導航</a>
                  <button @click="openModal(h.modal)" class="text-xs px-3 py-1.5 rounded-full bg-[#4A3525]/10">詳情</button>
                </div>
              </div>
            </div>
          </template>
        </div>

        <h2 class="font-display text-xl font-bold mt-6">🆘 緊急聯絡</h2>
        <div class="bg-white rounded-2xl shadow-md p-4 space-y-2 text-sm">
          <p><span class="font-medium">歐盟緊急電話：</span> 112</p>
          <p><span class="font-medium">駐匈牙利代表處：</span> +36-1-214-0900</p>
          <p><span class="font-medium">駐斯洛伐克代表處：</span> +421-2-5441-0616</p>
          <p><span class="font-medium">駐捷克代表處：</span> +420-233-320-606</p>
        </div>

        <h2 class="font-display text-xl font-bold mt-6">📌 自由備註</h2>
        <textarea x-model="infoNote" rows="4" placeholder="保險單號、接送預約、重要提醒…"
                  class="w-full bg-white rounded-2xl shadow-md p-4 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-[#AEC6CF]"></textarea>
      </div>

      <!-- ===== BUDGET ===== -->
      <div x-show="currentView === 'budget'" x-cloak class="space-y-5">
        <div class="rounded-2xl p-5 text-white shadow-lg" style="background: linear-gradient(135deg, #FFB7B2, #C1E1C1, #AEC6CF);">
          <p class="text-sm opacity-90">總預算概覽（4人）</p>
          <p class="font-display text-3xl font-bold mt-1">NT$ 503,606</p>
          <p class="text-sm mt-2 opacity-90">每人平均 · NT$ 125,902</p>
        </div>

        <template x-for="cat in budget" :key="cat.name">
          <div class="bg-white rounded-2xl shadow-md overflow-hidden">
            <div class="px-4 py-3 font-semibold flex justify-between" :style="`background:${cat.color}33`">
              <span x-text="cat.name"></span>
              <span x-text="'NT$ ' + cat.total.toLocaleString()"></span>
            </div>
            <div class="p-4 space-y-2 text-sm">
              <template x-for="item in cat.items" :key="item.name">
                <div class="flex justify-between gap-2">
                  <span class="opacity-80" x-text="item.name"></span>
                  <span class="font-medium whitespace-nowrap" x-text="'NT$ ' + item.amount.toLocaleString()"></span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </main>
  </div>

  <!-- ========== BOTTOM NAV ========== -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 max-app mx-auto bg-white/95 backdrop-blur-md border-t border-[#4A3525]/10 bottom-nav shadow-[0_-4px_20px_rgba(74,53,37,0.08)]">
    <div class="flex justify-around py-2">
      <template x-for="tab in tabs" :key="tab.id">
        <button @click="currentView = tab.id"
                class="flex flex-col items-center gap-0.5 px-3 py-1 transition"
                :class="currentView === tab.id ? 'scale-105' : 'opacity-60'">
          <span class="text-xl" x-text="tab.icon"
                :style="currentView === tab.id ? `filter: drop-shadow(0 0 4px ${countryColor(activeCountry)})` : ''"></span>
          <span class="text-[10px] font-medium" x-text="tab.label"
                :style="currentView === tab.id ? `color:${countryColor(activeCountry)}` : ''"></span>
        </button>
      </template>
    </div>
  </nav>

  <!-- ========== MODAL ========== -->
  <div x-show="modalOpen" x-cloak class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40" @click.self="modalOpen = false">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl w-full max-w-md max-h-[80vh] overflow-y-auto p-5 shadow-2xl" @click.stop>
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg" x-text="modalTitle"></h3>
        <button @click="modalOpen = false" class="text-2xl leading-none opacity-50">×</button>
      </div>
      <div class="text-sm leading-relaxed whitespace-pre-line" x-text="modalContent"></div>
    </div>
  </div>

  <script>
    function app() {
      return {
        currentView: 'plan',
        activeCountry: 'hu',
        activeDay: 'd1',
        modalOpen: false,
        modalTitle: '',
        modalContent: '',
        memo: '',
        infoNote: '',

        countries: [
          { id: 'hu', name: '匈牙利', color: '#FFB7B2' },
          { id: 'sk', name: '斯洛伐克', color: '#C1E1C1' },
          { id: 'cz', name: '捷克', color: '#AEC6CF' }
        ],
        tabs: [
          { id: 'plan', label: '行程', icon: '📅' },
          { id: 'lists', label: '清單', icon: '✅' },
          { id: 'info', label: '資訊', icon: 'ℹ️' },
          { id: 'budget', label: '預算', icon: '💰' }
        ],

        get filteredDays() {
          return this.days.filter(d => d.country === this.activeCountry);
        },

        countryColor(id) {
          return this.countries.find(c => c.id === id)?.color || '#FFB7B2';
        },

        openModal(data) {
          this.modalTitle = data.title;
          this.modalContent = data.content;
          this.modalOpen = true;
        },

        async fetchWeather(day) {
          if (day.temp !== null) return;
          try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${day.lat}&longitude=${day.lng}&current=temperature_2m,weather_code&timezone=auto`);
            const data = await res.json();
            day.temp = Math.round(data.current.temperature_2m);
            const code = data.current.weather_code;
            day.weatherIcon = code <= 3 ? '☀️' : code <= 48 ? '⛅' : code <= 67 ? '🌧️' : code <= 77 ? '🌨️' : '⛈️';
          } catch (e) {
            day.weatherIcon = '🌡️';
            day.temp = '--';
          }
        },

        init() {
          // Auto load weather for first visible day
          const first = this.filteredDays[0];
          if (first) this.fetchWeather(first);
        },

        // ========== DAYS DATA ==========
        days: [
          // --- HUNGARY ---
          {
            id: 'd1', country: 'hu', label: 'Day 1 10/30', fullDate: '10/30 週五', city: '布達佩斯',
            lat: 47.4979, lng: 19.0402, temp: null, weatherIcon: null,
            items: [
              { time: '07:05', title: '抵達布達佩斯機場', emoji: '✈️', desc: '東方航空經上海轉飛抵達李斯特·費倫茨國際機場 T2B。建議預先預約私人接送直達飯店，約 30 分鐘車程。', imgKey: null },
              { time: '09:30–13:30', title: 'Nova Apartments 入住 + 多瑙河散步', emoji: '🏨', desc: '辦理入住後沿多瑙河漫步，欣賞塞切尼鏈橋與布達山城對望的經典視角，感受金秋午後陽光灑落河面。', imgKey: 'danube,chain-bridge,budapest', map: 'https://www.google.com/maps/place/Nova+Apartments+Budapest' },
              { time: '17:00–19:00', title: '中央市集大廳', emoji: '🛒', desc: '布達佩斯最大室內市集，挑高華麗建築內販售香料、帕普rika、香腸與手工藝品。晚餐可在 Fakanál 品嚐地道匈牙利燉牛肉。', imgKey: 'great-market-hall,budapest', map: 'https://www.google.com/maps/place/%E5%B8%83%E9%81%94%E4%BD%A9%E6%96%AF%E4%B8%AD%E5%A4%AE%E5%B8%82%E5%A0%B4' }
            ]
          },
          {
            id: 'd2', country: 'hu', label: 'Day 2 10/31', fullDate: '10/31 週六', city: '布達佩斯',
            lat: 47.4979, lng: 19.0402, temp: null, weatherIcon: null,
            items: [
              { time: '10:00–13:00', title: '漁人堡 + 馬提亞斯教堂', emoji: '🏰', desc: '新哥特式白石堡壘俯瞰多瑙河與國會大廈，日落時分景色最美。鄰近馬提亞斯教堂彩繪屋頂與內部精美壁畫必訪。', imgKey: 'fishermans-bastion,budapest', map: 'https://www.google.com/maps/place/%E6%BC%81%E4%BA%BA%E5%A0%A1' },
              { time: '15:00–17:00', title: '布達皇宮漫遊', emoji: '🏛️', desc: '布達城堡區核心，現為國立藝廊與歷史博物館所在。秋天落葉鋪滿石階，拍照絕美，可搭城堡纜車下山。', imgKey: 'buda-castle,budapest', map: 'https://www.google.com/maps/place/%E5%B8%83%E9%81%94%E5%9F%8E%E5%A0%A1' },
              { time: '18:00–20:00', title: '鏈橋夜景', emoji: '🌉', desc: '塞切尼鏈橋華燈初上，獅子石雕與燈光倒映河面，是布達佩斯最浪漫的夜景之一。晚餐推薦 Café Kör。', imgKey: 'szechenyi-chain-bridge,night', map: 'https://www.google.com/maps/place/%E5%A1%9E%E5%88%87%E5%B0%BC%E9%8F%88%E6%A9%8B' }
            ]
          },
          {
            id: 'd3', country: 'hu', label: 'Day 3 11/01', fullDate: '11/01 週日', city: '布達佩斯',
            lat: 47.4979, lng: 19.0402, temp: null, weatherIcon: null,
            items: [
              { time: '10:00–11:30', title: '國會大廈導覽', emoji: '🏛️', desc: '新哥特式壯麗建築，匈牙利政治中心。內部導覽需提前預約，可見聖史蒂芬皇冠與華麗大廳。', imgKey: 'hungarian-parliament,budapest', map: 'https://www.google.com/maps/place/%E5%8C%88%E7%89%99%E5%88%A9%E5%9C%8B%E6%9C%83%E5%A4%A7%E5%BB%88' },
